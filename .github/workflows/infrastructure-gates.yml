name: infrastructure-gates

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      component_bundle_run_id:
        description: Same-repository Actions run containing the validated P7.3 component bundle
        required: true
        type: string
      component_bundle_artifact_name:
        description: Artifact whose archive root is the exact component bundle root
        required: true
        type: string
      component_bundle_sha256:
        description: Expected SHA-256 of the component index.json
        required: true
        type: string
      component_bundle_tree_sha256:
        description: Expected SHA-256 of the canonical component tree
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: infrastructure-gates-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENV: development
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+psycopg://omnibase:ci-placeholder@localhost:5432/omnibase_test
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci-placeholder
      MINIO_SECRET_KEY: ci-placeholder
      MINIO_BUCKET: omnibase-test
      REDIS_URL: redis://localhost:6379/15
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET: ci_placeholder_secret_at_least_32_characters_long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Format and focused infrastructure lint
        shell: bash
        run: |
          uv run ruff format --check \
            src/omnibase/auth/router.py \
            src/omnibase/core/config.py \
            src/omnibase/core/logging.py \
            src/omnibase/core/middleware.py \
            src/omnibase/core/rate_limit.py \
            src/omnibase/database/router.py \
            src/omnibase/documents/router.py \
            src/omnibase/main.py \
            src/omnibase/rag/embedding.py \
            src/omnibase/rag/parser.py \
            src/omnibase/rag/reranker.py \
            src/omnibase/rag/router.py \
            src/omnibase/rag/store.py \
            src/omnibase/tenants/dependencies.py \
            src/omnibase/control_plane \
            src/omnibase/capabilities \
            src/omnibase/capability_gateway \
            src/omnibase/controlled_data \
            src/omnibase/migrations/env.py \
            src/omnibase/migrations/versions/0004_p34_1_control_plane_foundation.py \
            src/omnibase/migrations/versions/0005_p34_2_capability_ledger.py \
            src/omnibase/migrations/versions/0006_p34_3_controlled_data.py \
            src/omnibase/production/phase5_admission.py \
            src/omnibase/production/phase5_registry_contract.py \
            src/omnibase/production/phase5_task_ledger_contract.py \
            src/omnibase/production/phase5_skill_contract.py \
            src/omnibase/production/trust_policy_candidate.py \
            src/omnibase/production/trust_policy_r1_assignment.py \
            tests/cleanup.py \
            tests/conftest.py \
            tests/integration/conftest.py \
            tests/integration/test_auth_e2e.py \
            tests/integration/test_p34_*.py \
            tests/test_destructive_test_safety.py \
            tests/test_health.py \
            tests/test_http_boundaries.py \
            tests/test_migration_scope_fail_closed.py \
            tests/test_p0_exposure_lockdown.py \
            tests/test_p34_*.py \
            tests/test_p5_0_admission.py \
            tests/test_p5_1_registry_contract.py \
            tests/test_p5_2a_task_ledger_contract.py \
            tests/test_p5_6a_skill_contract.py \
            tests/test_p5_1b_agent_registry.py \
            tests/test_p5_1c_registry_api.py \
            tests/test_p34_7_trust_policy_candidate.py \
            tests/test_p34_7_trust_policy_r1_assignment.py \
            tests/integration/test_p5_1c_browser_registry_api_foundation.py \
            src/omnibase/agent_registry \
            ../scripts/production/validate_p5_6a_skill_contract.py \
            ../scripts/production/validate_p34_7_trust_policy_candidate.py \
            ../scripts/production/validate_p34_7_trust_policy_r1_assignment.py \
            ../scripts/release/validate_p7_3_windows_acceptance_receipt.py \
            ../scripts/release/test_validate_p7_3_windows_acceptance_receipt.py \
            tests/test_rate_limit.py \
            tests/test_reranker_boundary.py \
            tests/test_tenants.py
          uv run ruff check \
            src/omnibase/auth/router.py \
            src/omnibase/core/config.py \
            src/omnibase/core/logging.py \
            src/omnibase/core/middleware.py \
            src/omnibase/core/rate_limit.py \
            src/omnibase/database/router.py \
            src/omnibase/documents/router.py \
            src/omnibase/main.py \
            src/omnibase/rag/embedding.py \
            src/omnibase/rag/parser.py \
            src/omnibase/rag/reranker.py \
            src/omnibase/rag/router.py \
            src/omnibase/rag/store.py \
            src/omnibase/tenants/dependencies.py \
            src/omnibase/control_plane \
            src/omnibase/capabilities \
            src/omnibase/capability_gateway \
            src/omnibase/controlled_data \
            src/omnibase/production/phase5_admission.py \
            src/omnibase/production/phase5_registry_contract.py \
            src/omnibase/production/phase5_task_ledger_contract.py \
            src/omnibase/production/phase5_skill_contract.py \
            src/omnibase/production/trust_policy_candidate.py \
            src/omnibase/production/trust_policy_r1_assignment.py \
            tests/test_migration_scope_fail_closed.py \
            tests/test_rate_limit.py \
            tests/test_p34_*.py \
            tests/test_p5_0_admission.py \
            tests/test_p5_2a_task_ledger_contract.py \
            tests/test_p5_6a_skill_contract.py \
            tests/test_p34_7_trust_policy_candidate.py \
            tests/test_p34_7_trust_policy_r1_assignment.py \
            ../scripts/production/validate_p5_6a_skill_contract.py \
            ../scripts/production/validate_p34_7_trust_policy_candidate.py \
            ../scripts/production/validate_p34_7_trust_policy_r1_assignment.py \
            ../scripts/release/validate_p7_3_windows_acceptance_receipt.py \
            ../scripts/release/test_validate_p7_3_windows_acceptance_receipt.py \
            tests/integration/test_p34_*.py
      - name: Full backend typecheck
        run: uv run mypy src
      - name: Compile backend and operator scripts
        run: |
          uv run python -m compileall -q src tests
          uv run python -m compileall -q ../scripts/database ../scripts/maintenance ../scripts/production
          uv run python -m compileall -q ../scripts/release/validate_p7_3_windows_acceptance_receipt.py ../scripts/release/test_validate_p7_3_windows_acceptance_receipt.py
      - name: Validate AI maintainer map and benchmark protocol
        run: |
          uv run python ../scripts/maintenance/validate_maintainer_map.py --repo-root ..
          uv run python ../scripts/maintenance/validate_maintainer_benchmark.py --repo-root ..
      - name: P5.0 Phase 5 admission contract (validate-only)
        run: uv run python ../scripts/production/validate_p5_0_admission.py --validate-only
      - name: P5.1A Agent Registry contract preflight (validate-only)
        run: uv run python ../scripts/production/validate_p5_1_registry_contract.py --validate-only
      - name: P5.2A Agent Task ledger contract preflight (validate-only)
        run: uv run python ../scripts/production/validate_p5_2a_task_ledger_contract.py --validate-only
      - name: P5.6A first-party native Skill contract preflight (validate-only)
        run: uv run python ../scripts/production/validate_p5_6a_skill_contract.py --validate-only
      - name: P34.7 Trust Policy Candidate R0 contract (validate-only)
        run: |
          uv run python ../scripts/production/validate_p34_7_trust_policy_candidate.py \
            --candidate "$GITHUB_WORKSPACE/deployment/production/p34-7-trust-policy-candidate.example.json" \
            --approval-packet "$GITHUB_WORKSPACE/deployment/production/p34-7-trust-policy-approval-packet.example.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --validate-only
      - name: P34.7 Trust Policy R1-A assignment contract (validate-only)
        run: |
          uv run python ../scripts/production/validate_p34_7_trust_policy_r1_assignment.py \
            --assignment "$GITHUB_WORKSPACE/deployment/production/p34-7-trust-policy-r1-assignment.example.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --validate-only
      - name: P5.1B registry persistence gate contract tests
        run: uv run pytest ../scripts/production/test_run_p5_1b_registry_disposable_gate.py -q
      - name: P5.1C browser registry API gate contract tests
        run: uv run pytest ../scripts/production/test_run_p5_1c_browser_registry_disposable_gate.py -q
      - name: P7.3 Windows acceptance receipt contract tests
        run: uv run pytest ../scripts/release/test_validate_p7_3_windows_acceptance_receipt.py -q
      - name: Backend non-integration tests
        run: uv run pytest -m "not integration"
      - name: OpenAPI and Python SDK contracts
        shell: bash
        run: |
          uv run pytest ../sdk/contracts/test_openapi_contract.py
          PYTHONPATH=../sdk/python/src uv run pytest ../sdk/python/tests
      - name: Python SDK lint
        working-directory: sdk/python
        run: ../../backend/.venv/bin/ruff check .

  frontend-and-typescript-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            sdk/typescript/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build
      - name: Install Chromium for the P7 Settings rendering gate
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: P7 Settings rendering and accessibility gate
        working-directory: frontend
        run: pnpm test:visual
      - name: Retain P7 Settings rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-settings-rendering-${{ github.run_id }}
          path: |
            frontend/test-results/p7-visual
            frontend/test-results/p7-visual-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Install locked TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile
      - name: TypeScript SDK contract
        working-directory: sdk/typescript
        run: |
          pnpm test
          pnpm typecheck

  windows-desktop-compatibility:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Windows desktop tests and build
        working-directory: desktop
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

  linux-desktop-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned desktop-local Python dependencies
        run: python -m pip install --requirement packaging/windows/OmniBase.DesktopBackend/requirements-build.txt
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Linux desktop tests and build
        working-directory: desktop
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Linux payload contract tests
        run: |
          python scripts/release/test_build_p7_5_linux_desktop_payload.py
          python scripts/release/test_build_p7_5_linux_desktop.py

  linux-desktop-appdir:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      ELECTRON_ZIP_NAME: electron-v43.4.0-linux-x64.zip
      ELECTRON_ZIP_SHA256: 7c5f7918bcae74a05a814543940eb28469c055edaa3cfcf41d0ff1787b314c52
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the validated P7.3 component bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component_bundle_artifact_name }}
          path: ${{ runner.temp }}/omnibase-p75/component-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.component_bundle_run_id }}
      - name: Validate and bind the component bundle identity
        shell: bash
        env:
          EXPECTED_COMPONENT_BUNDLE_SHA256: ${{ inputs.component_bundle_sha256 }}
          EXPECTED_COMPONENT_BUNDLE_TREE_SHA256: ${{ inputs.component_bundle_tree_sha256 }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "omnibase-p75/component-bundle"
          module_path = Path("scripts/release/export_p7_3_component_bundles.py")
          spec = importlib.util.spec_from_file_location("bundle_validator", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("component_bundle_validator_unavailable")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          report = module.validate_component_bundle(root)
          if report["bundle_sha256"] != os.environ["EXPECTED_COMPONENT_BUNDLE_SHA256"]:
              raise SystemExit("component_bundle_sha256_mismatch")
          if report["tree_sha256"] != os.environ["EXPECTED_COMPONENT_BUNDLE_TREE_SHA256"]:
              raise SystemExit("component_bundle_tree_sha256_mismatch")
          print(report)
          PY

      - name: Install and build the standalone frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install and build the desktop shell
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install pinned Linux backend build dependencies
        run: python -m pip install --disable-pip-version-check --requirement packaging/linux/OmniBase.DesktopBackend/requirements-build.txt
      - name: Build the Linux desktop backend
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omnibase-p75"
          python packaging/linux/OmniBase.DesktopBackend/build_backend.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --dist-dir "$RUNNER_TEMP/omnibase-p75/backend-dist" \
            --work-dir "$RUNNER_TEMP/omnibase-p75/backend-work" \
            | tee "$RUNNER_TEMP/omnibase-p75/backend-build.json"
      - name: Download and verify the pinned Linux Electron archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omnibase-p75/electron"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/omnibase-p75/electron/$ELECTRON_ZIP_NAME" \
            "https://github.com/electron/electron/releases/download/v43.4.0/$ELECTRON_ZIP_NAME"
          echo "$ELECTRON_ZIP_SHA256  $RUNNER_TEMP/omnibase-p75/electron/$ELECTRON_ZIP_NAME" | sha256sum --check --status
      - name: Build the unsigned Linux AppDir and report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omnibase-p75/appdir"
          python scripts/release/build_p7_5_linux_desktop.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --frontend-standalone-dir "$GITHUB_WORKSPACE/frontend/.next/standalone" \
            --frontend-static-dir "$GITHUB_WORKSPACE/frontend/.next/static" \
            --frontend-public-dir "$GITHUB_WORKSPACE/frontend/public" \
            --desktop-dist-dir "$GITHUB_WORKSPACE/desktop/dist" \
            --runtime-host-script "$GITHUB_WORKSPACE/packaging/linux/omnibase-runtime-host.mjs" \
            --backend-executable "$RUNNER_TEMP/omnibase-p75/backend-dist/OmniBase.Desktop.Backend/OmniBase.Desktop.Backend" \
            --node-executable "$(readlink -f "$(command -v node)")" \
            --desktop-project-dir "$GITHUB_WORKSPACE/desktop" \
            --electron-zip-dir "$RUNNER_TEMP/omnibase-p75/electron" \
            --electron-zip-sha256 "$ELECTRON_ZIP_SHA256" \
            --component-bundle-dir "$RUNNER_TEMP/omnibase-p75/component-bundle" \
            --component-bundle-sha256 "${{ inputs.component_bundle_sha256 }}" \
            --component-bundle-tree-sha256 "${{ inputs.component_bundle_tree_sha256 }}" \
            --payload-dir "$RUNNER_TEMP/omnibase-p75/payload" \
            --output-dir "$RUNNER_TEMP/omnibase-p75/appdir" \
            --application-version "1.0.0" \
            | tee "$RUNNER_TEMP/omnibase-p75/linux-desktop-build.json"
      - name: Upload Linux AppDir and raw build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-5-linux-appdir-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/omnibase-p75
          if-no-files-found: warn
          retention-days: 14

  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate disposable database Compose
        env:
          TEST_DATABASE_OWNER_PASSWORD: ci-owner-placeholder
          TEST_DATABASE_PASSWORD: ci-runner-placeholder
          TEST_DATABASE_NAME: omnibase_test_config
          TEST_DATABASE_ROLE: omnibase_test_config_runner
          TEST_DATABASE_PORT: "55432"
        run: docker compose -p omnibase-ci-config -f docker-compose.destructive-tests.yml config --quiet
      - name: Validate frontend production Compose
        env:
          FRONTEND_PROD_PORT: "3001"
        run: docker compose -f docker-compose.frontend-production.yml config --quiet

  postgres-sentinel-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: backend
    env:
      TEST_COMPOSE_PROJECT: omnibase-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DATABASE_NAME: omnibase_test_ci_${{ github.run_id }}_${{ github.run_attempt }}
      TEST_DATABASE_ROLE: omnibase_test_ci_runner
      TEST_DATABASE_PORT: "55432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Generate ephemeral disposable-database credentials
        shell: bash
        run: |
          owner_password="$(openssl rand -hex 24)"
          runner_password="$(openssl rand -hex 24)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$runner_password"
          echo "TEST_DATABASE_OWNER_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_PASSWORD=$runner_password" >> "$GITHUB_ENV"
      - name: Fresh migration and isolated integration gate
        run: make test-destructive

  personal-production-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs:
      - backend
      - frontend-and-typescript-sdk
      - compose-config
      - postgres-sentinel-integration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the offline P5.9P harness
        run: python scripts/production/test_run_p5_9p_personal_acceptance.py
      - name: Run the disposable personal production acceptance
        run: >-
          python scripts/production/run_p5_9p_personal_acceptance.py
          --repo-root "$GITHUB_WORKSPACE"
          --work-root "$RUNNER_TEMP/omnibase-p5-9p-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload the redacted P5.9P receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-9p-personal-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/omnibase-p5-9p-${{ github.run_id }}-${{ github.run_attempt }}/p5-9p-acceptance-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Assert disposable P5.9P resources are gone
        if: always()
        shell: bash
        run: |
          set -eu
          containers="$(docker ps -aq --filter 'name=omnibase-p59p-' || true)"
          networks="$(docker network ls --format '{{.Name}}' | grep -E '^omnibase-p59p-[ab]-[0-9a-f]{8}_' || true)"
          volumes="$(docker volume ls --format '{{.Name}}' | grep -E '^omnibase-p59p-[ab]-[0-9a-f]{8}_' || true)"
          if [ -n "$containers$networks$volumes" ]; then
            [ -z "$containers" ] || docker rm -f $containers
            [ -z "$networks" ] || docker network rm $networks
            [ -z "$volumes" ] || docker volume rm $volumes
            echo "P5.9P resources required workflow fallback cleanup" >&2
            exit 1
          fi

  frontend-production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start hardened production frontend
        env:
          FRONTEND_PROD_PORT: "3001"
        run: docker compose -p omnibase-ci-frontend-smoke -f docker-compose.frontend-production.yml up -d --build --wait
      - name: Verify health endpoint
        run: curl --fail --show-error --max-time 10 http://127.0.0.1:3001/healthz
      - name: Cleanup
        if: always()
        run: docker compose -p omnibase-ci-frontend-smoke -f docker-compose.frontend-production.yml down --remove-orphans
