[project]
name = "omnibase"
version = "0.1.0"
description = "OmniBase backend - AI-native personal knowledge workbench with database, RAG, and multi-agent orchestration."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OmniBase Contributors" }]
keywords = ["rag", "ai", "knowledge-base", "agents", "mcp", "pgvector"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# -----------------------------------------------------------
# 运行时依赖（生产镜像装这些）
# -----------------------------------------------------------
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0,<0.117",
    "uvicorn[standard]>=0.32,<0.34",
    "python-multipart>=0.0.12,<0.1",      # FastAPI 文件上传
    "websockets>=13,<15",                  # uvicorn WebSocket 支持

    # --- 配置与日志 ---
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<26",

    # --- 数据库 ---
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13,<1.15",
    "psycopg[binary]>=3.2,<4",             # psycopg3 + C 扩展（镜像内编译避免）
    "pgvector>=0.3.6,<0.4",                # pgvector SQLAlchemy 类型支持

    # --- 认证 ---
    "python-jose[cryptography]>=3.3,<4",   # JWT
    "cryptography>=43,<50",                # AES-GCM for user-owned provider credentials
    "passlib[bcrypt]>=1.7.4,<2",           # 密码哈希
    "email-validator>=2.2,<3",             # Pydantic EmailStr

    # --- 对象存储 ---
    "minio>=7.2.10,<8",

    # --- Redis（refresh token 存储，Phase 0 接入但不强用） ---
    "redis>=5.1,<6",

    # --- 文档解析（Phase 1: 全文提取 + 分块） ---
    "pypdf>=6.14.2,<7",                       # PDF 文本 + 元数据
    "python-docx>=1.1,<2",                # DOCX 段落 + 标题层级

    # --- RAG / Embedding（Phase 1: AI RAG） ---
    "sentence-transformers>=3.3,<4",       # bge-small-zh + bge-reranker 本地推理
    "numpy>=1.26,<3",                      # 向量运算

    # --- 后台任务（Phase 1: ingest pipeline） ---
    "celery[redis]>=5.4,<6",              # Celery worker

    # --- LLM（Phase 1: DeepSeek / 智谱 GLM via OpenAI-compatible API） ---
    "openai>=1.50,<2",                    # OpenAI SDK（兼容 DeepSeek/智谱）

    # --- 工具 ---
    "httpx>=0.27,<0.29",                   # HTTP 客户端（健康检查、回调）
    "python-dotenv>=1.0.1,<2",
    "tenacity>=9.0,<10",                   # 重试装饰器
]

[dependency-groups]
# -----------------------------------------------------------
# 开发依赖（uv sync 默认会装 dev 组；生产镜像用 --no-dev）
# -----------------------------------------------------------
dev = [
    # --- 测试 ---
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "pytest-cov>=5.0,<7",
    "pytest-mock>=3.14,<4",
    "coverage>=7.6,<8",

    # --- 类型检查 ---
    "mypy>=1.13,<2",
    "types-python-jose>=3.3,<4",

    # --- 代码质量 ---
    "ruff>=0.7,<0.9",

    # --- 调试 ---
    "ipython>=8.28,<9",
    "rich>=13.9,<14",
]

[project.urls]
Homepage = "https://github.com/omnibase/omnibase"
Repository = "https://github.com/omnibase/omnibase"
Documentation = "https://docs.omnibase.dev"
Issues = "https://github.com/omnibase/omnibase/issues"

# -----------------------------------------------------------
# CLI entry point: `omnibase migrate` / `omnibase tenants list` / `omnibase version`
# -----------------------------------------------------------
[project.scripts]
omnibase = "omnibase.cli.main:main"

# -----------------------------------------------------------
# uv 配置
# -----------------------------------------------------------
[tool.uv]
package = true

[tool.uv.sources]
# 未来：本地开发时 src/ 直接引用
# omnibase = { workspace = true }

# -----------------------------------------------------------
# 构建（用 hatchling 简单打包 src/ 布局）
# -----------------------------------------------------------
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibase"]

# -----------------------------------------------------------
# Ruff 配置（line-length=100，启用 preview 规则集）
# -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "migrations/versions"]

[tool.ruff.lint]
# 启用规则集
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking（类型导入优化）
    "ASYNC",  # flake8-async
    "S",      # bandit（安全）
    "A",      # builtin shadowing
    "C90",    # mccabe complexity
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",      # line too long（交给 formatter）
    "S101",      # use of assert（测试中常用）
    "S104",      # binding to all interfaces（容器内是必需的）
    "S603",      # subprocess call（已审计）
    "S607",      # partial executable path（容器内）
    "B008",      # function call in default argument（FastAPI Depends 模式）
    "RET504",    # unnecessary variable assignment before return（可读性优先）
    # Phase 0.5: relax rules that add noise without catching real bugs.
    # These can be re-enabled later as code quality improves.
    "TC001",     # type-only import first-party (no runtime benefit yet)
    "TC002",     # type-only import third-party
    "TC003",     # type-only import standard-library
    "N818",      # exception suffix "Error" (our classes use descriptive names)
    "G201",      # logging exc_info via extra= (we use explicit exc_info=True)
    "S110",      # try-except-pass (intentional in error handlers)
    "PT006",     # pytest parametrize first-arg type (style preference)
    "PT011",     # pytest.raises specificity (we test broad error types)
    "UP038",     # isinstance tuple (PEP 604 style not yet worth churn)
    "PIE810",    # startswith tuple (readability over micro-optimization)
    "RUF012",    # Mutable class attribute default (Pydantic/SQLAlchemy pattern)
    "S310",      # urlopen (we control the URLs)
    "S105",      # hardcoded password string (false positive on "bearer" token_type)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts OK in tests
    "S105",   # hardcoded password OK in tests
    "N802",   # function name case (test_*)
    "N803",   # argument case
    "N806",   # variable case
]
"migrations/**/*.py" = [
    "E402",   # module-level import not at top（Alembic 模板）
    "N999",   # invalid module name（Alembic 命名）
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["omnibase"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------
# Mypy 配置（Phase 0.5: relaxed; Phase 1+ 逐步收紧到 strict）
# -----------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Phase 0.5: not strict yet (126 errors under strict). Re-enable incrementally.
# strict = true
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI 装饰器是动态的
no_implicit_optional = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations/versions/", "build/", "dist/"]

# 第三方库无类型声明时的处理
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "minio.*",
    "pypdf.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------
# Pytest 配置
# -----------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (DB/MinIO/Redis)",
    "unit: marks pure unit tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:python_jose.*",
]

[tool.coverage.run]
source = ["src/omnibase"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",  # protocol stubs
]
fail_under = 80
