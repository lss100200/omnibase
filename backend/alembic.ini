# Alembic configuration for OmniBase
# -----------------------------------------------------------
# Notes:
# - Database URL is injected by migrations/env.py from app settings
# - Multi-tenant schema isolation is handled in env.py (B3 will add tenant loop)
# - script_location points to the package-internal migrations dir

[alembic]
# Path to migration scripts.
script_location = src/omnibase/migrations

# Template for new migration filenames.
# {rev}_{slug}.py - readable and sortable.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamp timezone (UTC for consistency)
timezone = UTC

# Output line length for logging
output_encoding = utf-8

# Truncate long SQL in log output
truncate_slug_length = 40

# Default revision target. Override with: alembic upgrade <target>
# sqlalchemy.url is intentionally NOT set here - env.py reads from app settings.

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
