services:
  fake-provider:
    image: python:3.11-alpine
    restart: "no"
    command: ["python", "/acceptance/p5_9p_fake_provider.py"]
    volumes:
      - type: bind
        source: ${P5_ACCEPTANCE_FAKE_PROVIDER_PATH:?set an absolute fake-provider script path}
        target: /acceptance/p5_9p_fake_provider.py
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks:
      - data

  backend:
    restart: "no"
    depends_on:
      fake-provider:
        condition: service_healthy
    environment:
      LLM_API_KEY: p5-9p-disposable-placeholder
      LLM_API_BASE_URL: http://fake-provider:8080/v1
      LLM_MODEL: p5-9p-fake-model
      LLM_PROVIDER: p5-9p-deterministic

  acceptance-fixture:
    image: omnibase-backend:personal-production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the operator env file}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the operator env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the operator env file}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in the operator env file}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in the operator env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the operator env file}
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:?set PROVIDER_CREDENTIAL_ENCRYPTION_KEY in the operator env file}
      MEMORY_CONTENT_ENCRYPTION_KEY: ${MEMORY_CONTENT_ENCRYPTION_KEY:?set MEMORY_CONTENT_ENCRYPTION_KEY in the operator env file}
    command: ["python", "/acceptance/p5_9p_acceptance_fixture.py"]
    volumes:
      - type: bind
        source: ${P5_ACCEPTANCE_FIXTURE_PATH:?set an absolute acceptance fixture path}
        target: /acceptance/p5_9p_acceptance_fixture.py
        read_only: true
      - type: bind
        source: ${P5_ACCEPTANCE_CANARY_CONFIG:?set an absolute canonical config path}
        target: /run/omnibase-personal/canary.json
        read_only: true
      - type: bind
        source: ${P5_ACCEPTANCE_STATE_DIR:?set an absolute state directory}
        target: /run/omnibase-personal/state
      - type: bind
        source: ${P5_ACCEPTANCE_READINESS_ROOT:?set an absolute readiness root}
        target: /run/omnibase-personal/readiness-root
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
