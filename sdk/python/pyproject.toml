[project]
name = "omnibase-sdk"
version = "0.1.0"
description = "Project-local SDK for OmniBase's capability-gated workload API."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibase_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S106"]
"tests/**/*.py" = ["S106"]
"**/tests/*.py" = ["S106"]
"**/tests/**/*.py" = ["S106"]
